[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idrt-disaster-image-analysis"
version = "0.1.0"
description = "Reproducible satellite-image similarity and disaster change analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "Pillow>=11,<13",
  "matplotlib>=3.9,<4",
  "opencv-python-headless>=4.10,<5",
  "scikit-image>=0.24,<1",
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
]

[project.scripts]
idrt-analyze = "idrt_analysis.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

